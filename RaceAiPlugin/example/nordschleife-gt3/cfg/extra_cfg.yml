# AssettoServer extra configuration for the Race AI example (only the relevant keys, everything else uses the defaults)
# The traffic AI must stay off: the racing bots use the AI=fixed slots of entry_list.ini
EnableAi: false
EnablePlugins:
  - RaceAiPlugin
# CSP weather (Sol/Pure): rain, smooth transitions. Needed for RealWeather in plugin_race_ai_cfg.yml
EnableWeatherFx: true
# Real time of day at the track (with RealWeather: day/night and weather match the Nürburgring right now)
EnableRealTime: false
