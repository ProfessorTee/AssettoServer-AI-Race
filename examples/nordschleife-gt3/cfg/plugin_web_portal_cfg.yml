# Dashboard (desktop GUI, live map, bot control) at http://127.0.0.1:<HTTP_PORT>/admin
# false = only from the server computer; true = also from other computers with the ADMIN_PASSWORD
DashboardRemoteAccess: false
# Join page also shows the local-network address (only for a server at home)
JoinShowLan: false
# What the server address alone (http://<server>:<HTTP_PORT>/) opens: Join (join page), Live (live page) or None
LandingPage: Join
